[manifest]
version = "1.0.0"
dump_lua = true
priority = 2

[[patches]]
[patches.pattern]
target = 'cardarea.lua'
pattern = '''
                local highlight_height = G.HIGHLIGHT_H
                if not card.highlighted then highlight_height = 0 end
'''
position = "after"
payload = '''
local injoggen_height = card.injoggen and 0.5 * G.HIGHLIGHT_H or 0
'''
match_indent = true
[[patches]]
[patches.pattern]
target = 'main.lua'
pattern = '''
require "engine/object"
'''
position = "before"
payload = '''
MEDIUM = {}
'''
match_indent = true
[[patches]]
[patches.pattern]
target = 'cardarea.lua'
pattern = '''
                card.T.y = G.hand.T.y - 1.8*card.T.h - highlight_height + (G.SETTINGS.reduced_motion and 0 or 1)*0.1*math.sin(0.666*G.TIMERS.REAL+card.T.x) + math.abs(1.3*(-#self.cards/2 + k-0.5)/(#self.cards))^2-0.3
'''
position = "at"
payload = '''
card.T.y = G.hand.T.y - 1.8*card.T.h + injoggen_height - highlight_height + (G.SETTINGS.reduced_motion and 0 or 1)*0.1*math.sin(0.666*G.TIMERS.REAL+card.T.x) + math.abs(1.3*(-#self.cards/2 + k-0.5)/(#self.cards))^2-0.3
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'cardarea.lua'
pattern = '''
                card.T.y = self.T.y + self.T.h/2 - card.T.h/2 - highlight_height + (G.SETTINGS.reduced_motion and 0 or 1)*0.03*math.sin(0.666*G.TIMERS.REAL+card.T.x) + math.abs(0.5*(-#self.cards/2 + k-0.5)/(#self.cards))-0.2
'''
position = "at"
payload = '''
card.T.y = self.T.y + self.T.h/2 + injoggen_height - card.T.h/2 - highlight_height + (G.SETTINGS.reduced_motion and 0 or 1)*0.03*math.sin(0.666*G.TIMERS.REAL+card.T.x) + math.abs(0.5*(-#self.cards/2 + k-0.5)/(#self.cards))-0.2
'''
match_indent = true


[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
    elseif eval_type == 'extra' or eval_type == 'jokers' then 
        sound = extra.edition and 'foil2' or extra.mult_mod and 'multhit1' or extra.Xmult_mod and 'multhit2' or 'generic1'
'''
position = "at"
payload = '''
    elseif eval_type == 'extra' or eval_type == 'jokers' then 
        sound = not extra.sound and (extra.edition and 'foil2' or extra.mult_mod and 'multhit1' or extra.Xmult_mod and 'multhit2' or 'generic1') or extra.sound
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
                return base + G.GAME.hands[hand]['l_' .. parameter] * amount
'''
position = "at"
payload = '''
                return (base or 0) + (parameter ~= "med_jank" and (G.GAME.hands[hand]['l_' .. parameter] * amount) or 0)
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'cardarea.lua'
pattern = '''
table.sort(self.cards, function (a, b) return a.T.x + a.T.w/2 - 100*((a.pinned and not a.ignore_pinned) and a.sort_id or 0) < b.T.x + b.T.w/2 - 100*((b.pinned and not b.ignore_pinned) and b.sort_id or 0) end)
'''
position = "at"
payload = '''
        table.sort(self.cards, G.GAME and G.MODUSFUNCS[G.GAME.modus] or function (a, b) return a.T.x + a.T.w/2 - 100*((a.pinned and not a.ignore_pinned) and a.sort_id or 0) < b.T.x + b.T.w/2 - 100*((b.pinned and not b.ignore_pinned) and b.sort_id or 0) end)
'''
match_indent = true
